# DTBO Peak Brightness Guard configuration

# Live device-tree root to inspect after boot.
DT_ROOT=/sys/firmware/devicetree/base

# Panel path marker and property written by patch_odin3_hdr_dtbo.ps1.
PANEL_MARKER=icna3520
PEAK_PROP=qcom,mdss-dsi-panel-peak-brightness

# Expected bytes, big-endian:
# 00 77 63 9b = 7824283 -> 782.4283 nits
EXPECTED_HEX=0077639b

# Stock bytes, big-endian:
# 00 40 16 40 = 4200000 -> 420.0 nits
STOCK_HEX=00401640

# Images are intentionally user-provided. Copy them here after running the
# PowerShell patcher:
#   dtbo_patched.img  = patched/readback DTBO image
#   dtbo_original.img = original backup DTBO image
PATCHED_IMG=/data/adb/dtbo_guard/dtbo_patched.img
ORIGINAL_IMG=/data/adb/dtbo_guard/dtbo_original.img

# 1 = flash PATCHED_IMG to the active dtbo slot if a stock value is detected.
# 0 = log only.
AUTO_FLASH=1

# 1 = also keep the inactive dtbo slot byte-identical to PATCHED_IMG.
# Only enable this if you intentionally want both slots patched with the same
# image.
PATCH_BOTH_SLOTS=0

# 1 = uninstall restores ORIGINAL_IMG to both dtbo slots.
# 0 = uninstall restores only the currently active dtbo slot.
RESTORE_BOTH_SLOTS=0
